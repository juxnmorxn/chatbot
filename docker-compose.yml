services:
  postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_password
      POSTGRES_DB: evolution_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      chatbot_net:
        aliases:
          - postgres
          - evolution_postgres

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: always
    depends_on:
      - postgres
    environment:
      - SERVER_URL=http://2.25.241.239:8080
      - AUTHENTICATION_API_KEY=429644-cloudware-key-auth
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_password@evolution_postgres:5432/evolution_db?schema=public
      - CACHE_REDIS_ENABLED=false
      - QRCODE_LIMIT=30
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - chatbot_net

  chatbot_app:
    build: .
    container_name: chatbot_app
    restart: always
    depends_on:
      - evolution_api
    env_file:
      - .env
    environment:
      - EVOLUTION_URL=http://127.0.0.1:8080
      - EVOLUTION_API_KEY=429644-cloudware-key-auth
    network_mode: "host"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./data:/app/data
      - /etc/wireguard:/etc/wireguard

  genieacs_mongo:
    image: mongo:6.0
    container_name: genieacs_mongo
    restart: always
    volumes:
      - mongodata:/data/db
    networks:
      - chatbot_net

  genieacs:
    build:
      context: .
      dockerfile: Dockerfile.genieacs
    container_name: genieacs
    restart: always
    depends_on:
      - genieacs_mongo
    environment:
      - GENIEACS_MONGODB_CONNECTION_URL=mongodb://genieacs_mongo:27017/genieacs
      - GENIEACS_CWMP_PORT=7547
      - GENIEACS_NBI_PORT=7557
      - GENIEACS_FS_PORT=7567
      - GENIEACS_UI_PORT=7558
    ports:
      - "7547:7547"
      - "7557:7557"
      - "7567:7567"
      - "7558:7558"
    networks:
      - chatbot_net

volumes:
  pgdata:
  evolution_instances:
  mongodata:

networks:
  chatbot_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
